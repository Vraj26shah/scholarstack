<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Handwritten semester notes for VIT Bhopal students, filed by batch and branch." />
    <meta name="theme-color" content="#2F3C7E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      Link previews on LinkedIn, WhatsApp, Instagram, Telegram and X. Course and bundle links get
      their own title and description from the Worker (apps/api/src/http/share-preview.ts).
      Change the address if the domain changes; bump ?v= when og-image.png changes, so apps that
      cached the old card fetch the new one.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://scholarstack.campusnotes.workers.dev/" />
    <meta property="og:site_name" content="Scholars Stack" />
    <meta property="og:title" content="Scholars Stack · semester notes, stacked" />
    <meta property="og:description" content="Handwritten semester notes from seniors, filed by batch and branch. Peek at page one before you buy." />
    <meta property="og:image" content="https://scholarstack.campusnotes.workers.dev/og-image.png?v=2" />
    <meta property="og:image:secure_url" content="https://scholarstack.campusnotes.workers.dev/og-image.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Scholars Stack: every lecture, stacked. Handwritten semester notes for VIT Bhopal students." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scholars Stack · semester notes, stacked" />
    <meta name="twitter:description" content="Handwritten semester notes from seniors, filed by batch and branch. Peek at page one before you buy." />
    <meta name="twitter:image" content="https://scholarstack.campusnotes.workers.dev/og-image.png?v=2" />    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&family=Geist:wght@400;500;600;700&display=swap" />
    <!-- The logo and the handwritten margin notes only need a handful of letters. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap&text=%20Sachklorst" />
    <title>Scholars Stack · semester notes, stacked</title>
    <script src="/theme-init.js"></script>
  </head>

    <div id="root"></div>
