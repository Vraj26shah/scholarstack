<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline</title>
<style>
  html,body{margin:0;height:100%;background:#f1f1f2;color:#161b3a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:32px 24px;box-sizing:border-box;max-width:460px;margin:0 auto}
  .mark{width:56px;height:56px;border-radius:18px;background:#2f3c7e;display:grid;place-items:center;color:#fff;font:800 30px Georgia,serif}
  h1{margin:8px 0 0;font:800 30px/1.1 Georgia,serif;letter-spacing:-.02em}
  p{margin:0;font-size:17px;line-height:1.5;color:#4d5675}
  button{margin-top:8px;height:56px;border:0;border-radius:18px;background:#2f3c7e;color:#fff;font-size:18px;font-weight:800}
  @media (prefers-color-scheme:dark){html,body{background:#0d1016;color:#eceef4}p{color:#a4abbb}}
</style>
</head>
<body>
<main>
  <div class="mark">S</div>
  <h1>You're offline</h1>
  <p>Scholars Stack needs the internet to load. Check your Wi-Fi or mobile data, then try again.</p>
  <button onclick="location.href='https://scholarstack.campusnotes.workers.dev/app'">Try again</button>
</main>
<script>addEventListener('online',function(){location.href='https://scholarstack.campusnotes.workers.dev/app'})</script>
</body>
</html>
