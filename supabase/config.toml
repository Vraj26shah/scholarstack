# Minimal Supabase CLI config for local development (`pnpm db:start`).
project_id = "scholars-stack"

[api]
port = 54321

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_vit_only"

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
