name: Convert queued course files

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversion-poller
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check required repository secrets
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TILE_SEED_SECRET: ${{ secrets.TILE_SEED_SECRET }}
          CONVERTER_CALLBACK_URL: ${{ secrets.CONVERTER_CALLBACK_URL }}
          CONVERTER_CALLBACK_SECRET: ${{ secrets.CONVERTER_CALLBACK_SECRET }}
        run: |
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET TILE_SEED_SECRET CONVERTER_CALLBACK_URL CONVERTER_CALLBACK_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing Actions secret::$name must be added under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install the converter dependencies
        run: pnpm install --filter @ss/converter... --frozen-lockfile

      - name: Check R2 for queued files
        id: queue
        run: pnpm --filter @ss/converter queue:check
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TILE_SEED_SECRET: ${{ secrets.TILE_SEED_SECRET }}
          CONVERTER_CALLBACK_URL: ${{ secrets.CONVERTER_CALLBACK_URL }}
          CONVERTER_CALLBACK_SECRET: ${{ secrets.CONVERTER_CALLBACK_SECRET }}
          CONVERT_QUEUE_MODE: 'true'
          CONVERT_QUEUE_CHECK_ONLY: 'true'

      - name: Install document renderers
        if: steps.queue.outputs.has_work == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-liberation fonts-noto-core libreoffice-core libreoffice-impress libreoffice-writer poppler-utils

      - name: Process up to five queued files
        if: steps.queue.outputs.has_work == 'true'
        run: pnpm --filter @ss/converter convert
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TILE_SEED_SECRET: ${{ secrets.TILE_SEED_SECRET }}
          CONVERTER_CALLBACK_URL: ${{ secrets.CONVERTER_CALLBACK_URL }}
          CONVERTER_CALLBACK_SECRET: ${{ secrets.CONVERTER_CALLBACK_SECRET }}
          CONVERT_QUEUE_MODE: 'true'
          CONVERTER_MAX_QUEUE_JOBS: '5'

      - name: Report idle poll
        if: steps.queue.outputs.has_work != 'true'
        run: echo 'R2 has no queued conversion files.'
