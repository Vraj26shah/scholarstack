name: Check and deploy
# Every push and pull request: quick checks (about 3 minutes).
# A push to main that passes them deploys to production on its own.
# "Run workflow" (Actions tab) deploys the current main by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, database
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Database migrations build cleanly
        run: pnpm db:verify
      - name: Site and Worker bundle
        run: |
          pnpm --filter @ss/web build:demo
          pnpm --filter @ss/api build

  deploy:
    name: Deploy to production
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://scholarstack.campusnotes.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Everything the deploy needs is set
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || secrets.ADMIN_EMAILS }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ vars.VITE_RAZORPAY_KEY_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_SECRET_KEY ADMIN_EMAILS; do  # ADMIN_EMAILS: a variable or a secret
            [[ -n "${!name:-}" ]] || { echo "::error title=Missing secret::Add $name under Settings → Secrets and variables → Actions → Secrets."; missing=1; }
          done
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_RAZORPAY_KEY_ID; do
            [[ -n "${!name:-}" ]] || { echo "::error title=Missing variable::Add $name under Settings → Secrets and variables → Actions → Variables."; missing=1; }
          done
          exit "$missing"

      - name: Database migrations, sign-in settings and admin list
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || secrets.ADMIN_EMAILS }}
        run: |
          # The ops tool reads a .env file; give it only what these two steps need.
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
            echo "SUPABASE_ACCESS_TOKEN=$SUPABASE_ACCESS_TOKEN"
            echo "SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF"
            echo "ADMIN_EMAILS=$ADMIN_EMAILS"
            echo "APP_URL=$SITE_URL"
            echo "ALLOWED_EMAIL_DOMAIN=vitbhopal.ac.in"
          } > .env
          pnpm ops db:apply
          pnpm ops admins:sync
          rm -f .env

      - name: Build the website
        run: pnpm --filter @ss/web build
        env:
          VITE_APP_NAME: Scholars Stack
          VITE_API_BASE_URL: /api
          VITE_ALLOWED_EMAIL_DOMAIN: vitbhopal.ac.in
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ vars.VITE_RAZORPAY_KEY_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Deploy the Worker and site
        run: pnpm --filter @ss/api exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: The live site answers
        shell: bash
        run: |
          for path in /api/health /api/catalogue /; do
            ok=0
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$path")
              [[ "$code" == 200 ]] && { ok=1; break; }
              sleep 6
            done
            [[ $ok == 1 ]] || { echo "::error title=Live check failed::$SITE_URL$path answered $code"; exit 1; }
            echo "✓ $path"
          done
