name: Check and deploy
# Every push and pull request: quick checks (about 3 minutes).
# A push to main that passes them deploys to production on its own.
# "Run workflow" (Actions tab) deploys the current main by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests, database
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Database migrations build cleanly
        run: pnpm db:verify
      - name: Site and Worker bundle
        run: |
          pnpm --filter @ss/web build:demo
          pnpm --filter @ss/api build

  deploy:
    name: Deploy to production
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://scholarstack.campusnotes.workers.dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Everything the deploy needs is set
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || secrets.ADMIN_EMAILS }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || vars.VITE_RAZORPAY_KEY_ID || secrets.VITE_RAZORPAY_KEY_ID }} # the site uses the same key ID as the server
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_PROJECT_REF SUPABASE_SECRET_KEY ADMIN_EMAILS; do  # ADMIN_EMAILS: a variable or a secret
            [[ -n "${!name:-}" ]] || { echo "::error title=Missing secret::Add $name under Settings → Secrets and variables → Actions → Secrets."; missing=1; }
          done
          # Migrations need one of these: the access token, or the database password.
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" && -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error title=No way to update the database::Add SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD under Settings → Secrets and variables → Actions → Secrets."
            missing=1
          fi
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_RAZORPAY_KEY_ID; do
            [[ -n "${!name:-}" ]] || { echo "::error title=Missing variable::Add $name under Settings → Secrets and variables → Actions → Variables."; missing=1; }
          done
          exit "$missing"

      - name: Database migrations, sign-in settings and admin list
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST || 'aws-1-ap-southeast-1.pooler.supabase.com' }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || secrets.ADMIN_EMAILS }}
        run: |
          # The ops tool reads a .env file; give it only what these two steps need.
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
            echo "SUPABASE_ACCESS_TOKEN=$SUPABASE_ACCESS_TOKEN"
            echo "SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF"
            echo "ADMIN_EMAILS=$ADMIN_EMAILS"
            echo "APP_URL=$SITE_URL"
            echo "ALLOWED_EMAIL_DOMAIN=vitbhopal.ac.in"
          } > .env
          # 1) The access token (also refreshes sign-in settings). 2) If it is missing or expired,
          # the database password over the session pooler: the same idempotent apply-all.sql
          # you would paste into the SQL Editor (migrations already there are skipped).
          if [[ -n "$SUPABASE_ACCESS_TOKEN" ]] && pnpm ops db:apply; then
            echo "✓ migrations applied with the access token"
          elif [[ -n "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::warning title=Supabase access token not usable::Applied migrations with the database password instead. Renew SUPABASE_ACCESS_TOKEN when you can (it also keeps sign-in settings up to date)."
            export PGPASSWORD="$SUPABASE_DB_PASSWORD" PGSSLMODE=require PGCONNECT_TIMEOUT=20
            conn="host=$POOLER_HOST port=5432 dbname=postgres user=postgres.$SUPABASE_PROJECT_REF"
            psql "$conn" -v ON_ERROR_STOP=1 -q -f supabase/apply-all.sql
            psql "$conn" -v ON_ERROR_STOP=1 -q -c "notify pgrst, 'reload schema';"
            echo "✓ migrations applied with the database password"
          else
            echo "::error title=Database not updated::SUPABASE_ACCESS_TOKEN is missing or expired and SUPABASE_DB_PASSWORD is not set. Nothing was deployed."
            exit 1
          fi
          pnpm ops admins:sync
          rm -f .env

      - name: Build the website
        run: pnpm --filter @ss/web build
        env:
          VITE_APP_NAME: Scholars Stack
          VITE_API_BASE_URL: /api
          VITE_ALLOWED_EMAIL_DOMAIN: vitbhopal.ac.in
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || vars.VITE_RAZORPAY_KEY_ID || secrets.VITE_RAZORPAY_KEY_ID }} # the site uses the same key ID as the server
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      # GitHub is the one place the Worker's secrets are kept. Every deploy copies each one that is
      # set (secret or variable) to Cloudflare in a single call, so the two never drift apart.
      # Razorpay's pair is checked with Razorpay first: a wrong pair stops here with a clear
      # message, not at a student's checkout. The site is always built with the same key ID
      # (RAZORPAY_KEY_ID), so a leftover VITE_RAZORPAY_KEY_ID can't make them differ.
      - name: Sync Worker secrets from GitHub to Cloudflare
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || vars.SUPABASE_SECRET_KEY }}
          SUPABASE_LEGACY_JWT_SECRET: ${{ secrets.SUPABASE_LEGACY_JWT_SECRET || vars.SUPABASE_LEGACY_JWT_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || vars.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET || vars.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET || vars.RAZORPAY_WEBHOOK_SECRET }}
          VIEWER_TOKEN_SECRET: ${{ secrets.VIEWER_TOKEN_SECRET || vars.VIEWER_TOKEN_SECRET }}
          DEVICE_COOKIE_SECRET: ${{ secrets.DEVICE_COOKIE_SECRET || vars.DEVICE_COOKIE_SECRET }}
          TILE_SEED_SECRET: ${{ secrets.TILE_SEED_SECRET || vars.TILE_SEED_SECRET }}
          CONVERTER_CALLBACK_SECRET: ${{ secrets.CONVERTER_CALLBACK_SECRET || vars.CONVERTER_CALLBACK_SECRET }}
          CONVERTER_CALLBACK_URL: ${{ secrets.CONVERTER_CALLBACK_URL || vars.CONVERTER_CALLBACK_URL }}
          CONVERTER_DISPATCH_TOKEN: ${{ secrets.CONVERTER_DISPATCH_TOKEN || vars.CONVERTER_DISPATCH_TOKEN }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || vars.ADMIN_EMAILS }}
          CURRENT_INTAKE_YEAR: ${{ secrets.CURRENT_INTAKE_YEAR || vars.CURRENT_INTAKE_YEAR }}
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || vars.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME || vars.EMAIL_FROM_NAME }}
          WORKER_SECRET_NAMES: SUPABASE_URL SUPABASE_SECRET_KEY SUPABASE_LEGACY_JWT_SECRET RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET VIEWER_TOKEN_SECRET DEVICE_COOKIE_SECRET TILE_SEED_SECRET CONVERTER_CALLBACK_SECRET CONVERTER_CALLBACK_URL CONVERTER_DISPATCH_TOKEN ADMIN_EMAILS CURRENT_INTAKE_YEAR APP_URL BREVO_API_KEY EMAIL_FROM EMAIL_FROM_NAME
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$RAZORPAY_KEY_ID" && -n "$RAZORPAY_KEY_SECRET" ]]; then
            id="$(printf '%s' "$RAZORPAY_KEY_ID" | tr -d '[:space:]')"
            secret="$(printf '%s' "$RAZORPAY_KEY_SECRET" | tr -d '[:space:]')"
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "$id:$secret" "https://api.razorpay.com/v1/orders?count=1")
            if [[ "$code" != 200 ]]; then
              echo "::error title=Razorpay rejected the keys ($code)::RAZORPAY_KEY_SECRET does not belong to RAZORPAY_KEY_ID. Copy both from the same row in Razorpay → Settings → API Keys."
              exit 1
            fi
            [[ $id == rzp_live_* ]] && echo "✓ Razorpay keys accepted (live mode)" || echo "✓ Razorpay keys accepted (test mode)"
          fi
          # One JSON file of every secret that is set, values trimmed of stray spaces and line breaks.
          node -e '
            const out = {};
            for (const name of process.env.WORKER_SECRET_NAMES.split(" ")) {
              const v = (process.env[name] ?? "").trim();
              if (v) out[name] = v;
            }
            require("fs").writeFileSync("worker-secrets.json", JSON.stringify(out), { mode: 0o600 });
            console.log("Copying " + Object.keys(out).length + " secrets: " + Object.keys(out).join(", "));
          '
          pnpm --filter @ss/api exec wrangler secret bulk "$PWD/worker-secrets.json" --env production
          rm -f worker-secrets.json

      - name: Deploy the Worker and site
        run: pnpm --filter @ss/api exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: The live site answers
        shell: bash
        run: |
          for path in /api/health /api/catalogue /; do
            ok=0
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$path")
              [[ "$code" == 200 ]] && { ok=1; break; }
              sleep 6
            done
            [[ $ok == 1 ]] || { echo "::error title=Live check failed::$SITE_URL$path answered $code"; exit 1; }
            echo "✓ $path"
          done
